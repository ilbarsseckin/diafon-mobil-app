workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketlerini kur
        script: |
          flutter pub get
      - name: CocoaPods kur
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Sertifika hazirla ve bekle
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.ilbarslab.smartdiafon" --type IOS_APP_STORE --create --verbose || true
          keychain add-certificates || true
          echo "==== SSH ILE BAGLAN, SORUNU INCELE ===="
          echo "Komut: xcode-project use-profiles --verbose"
          sleep 2400
      - name: IPA olustur
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ilbarsseckin@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
