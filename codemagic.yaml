workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketlerini kur
        script: |
          flutter pub get
      - name: CocoaPods kur
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: SSH icin bekle
        script: |
          echo "==================================================="
          echo "Xcode ac: open ios/Runner.xcworkspace"
          echo "Runner target > Signing & Capabilities"
          echo "Automatically manage signing = ON, Team sec"
          echo "Sonra bu satiri silip build devam edecek"
          echo "==================================================="
          sleep 1800
      - name: IPA olustur
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ilbarsseckin@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
