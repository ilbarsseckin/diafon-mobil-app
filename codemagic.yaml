workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketlerini kur
        script: |
          flutter pub get

      - name: CocoaPods kur
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Sertifika ve profil olustur
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.ilbarslab.smartdiafon" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Debug icin imzalamayi derle
        script: |
          flutter build ios --release --no-codesign

      - name: IPA olustur (imzali)
        script: |
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ilbarsseckin@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
